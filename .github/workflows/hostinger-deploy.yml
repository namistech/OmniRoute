name: Production Build & Deploy to Hostinger

on:
  push:
    branches:
      - main  # Adjust this if your connected branch name is different (e.g., release/v3.8.53)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: 22
          cache: 'npm'

      - name: Install Monorepo & Dev Dependencies
        run: |
          npm ci --include=dev --legacy-peer-deps

      - name: Execute Standalone Standalone Compile
        run: |
          # Tells Next.js to package all dependencies inside .next/standalone
          export NEXT_PRIVATE_STANDALONE=true
          npm run build

      - name: Deploy Compiled Standalone Bundle to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # Points specifically to the native standalone files generated by Next.js
          local-dir: .next/standalone/
          server-dir: public_html/
